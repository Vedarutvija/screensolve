# ScreenSolve agent config

# Where the server is running
server_url: https://screensolve-wwpbqn.drytis.dev

# How captures are triggered:
#   telegram = capture only when you send 'c' in the Telegram bot chat
#              (send 's' there to solve all captured parts as one question)  ← recommended
#   periodic = capture automatically every `interval` seconds
#   hotkey   = capture when you press the `hotkey` combination
mode: telegram

# How often (seconds) the agent checks for Telegram commands (telegram mode)
poll_seconds: 1.5

# Seconds between captures in periodic mode
interval: 30

# Global hotkey (only used when mode: hotkey)
hotkey: ctrl+alt+s

# "screen" = full primary display, "window" = active window only
capture: screen
