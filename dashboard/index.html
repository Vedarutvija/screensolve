<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenSolve</title>
<link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --text:#e8edf7; --dim:#93a0b8; --accent:#4f8cff; --ok:#2ecc71; --warn:#f39c12; --err:#e74c3c; --purple:#a78bfa; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; z-index:10; background:rgba(15,20,32,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; gap:10px; }
header h1 { font-size:18px; font-weight:700; }
header .live { margin-left:auto; font-size:11px; color:var(--dim); display:flex; align-items:center; gap:5px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
main { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
.empty { text-align:center; color:var(--dim); padding:60px 20px; line-height:1.6; }
.empty b { color:var(--text); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.card-top { display:flex; gap:12px; padding:12px; align-items:center; }
.thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#0a0e17; border:1px solid var(--line); cursor:pointer; flex-shrink:0; }
.meta { min-width:0; flex:1; }
.status { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
.status.pending,.status.analyzing { background:rgba(243,156,18,.15); color:var(--warn); }
.status.no_question { background:rgba(147,160,184,.15); color:var(--dim); }
.status.solved { background:rgba(46,204,113,.15); color:var(--ok); }
.status.error { background:rgba(231,76,60,.15); color:var(--err); }
.time { font-size:11px; color:var(--dim); margin-top:5px; }
.problem { padding:0 14px 12px; font-size:14px; line-height:1.55; color:var(--text); }
.problem b { color:var(--accent); }
.card-body { border-top:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:14px; }
.badges { display:flex; gap:8px; flex-wrap:wrap; }
.badge { font-size:11px; padding:3px 9px; border-radius:6px; background:rgba(79,140,255,.14); color:var(--accent); font-weight:600; }
.badge.space { background:rgba(167,139,250,.14); color:var(--purple); }
.section h3 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:8px; }
ol.steps { padding-left:20px; display:flex; flex-direction:column; gap:7px; font-size:13.5px; line-height:1.55; }
ol.steps li::marker { color:var(--accent); font-weight:700; }
pre { background:#0a0e17; border:1px solid var(--line); border-radius:10px; padding:12px; overflow-x:auto; font-size:12.5px; line-height:1.5; }
pre code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.attempt { background:rgba(243,156,18,.07); border:1px solid rgba(243,156,18,.3); border-radius:10px; padding:12px; font-size:13px; line-height:1.55; white-space:pre-wrap; font-family:ui-monospace,monospace; overflow-x:auto; }
.notes { background:rgba(46,204,113,.07); border:1px solid rgba(46,204,113,.3); border-radius:10px; padding:12px; font-size:13px; line-height:1.55; }
.errbox { color:var(--err); font-size:13px; padding:12px; line-height:1.5; }
.spinner { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:-2px; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg);} }
/* lightbox */
#lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:100; align-items:center; justify-content:center; padding:16px; }
#lb img { max-width:100%; max-height:100%; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>📸 ScreenSolve</h1>
  <span class="live"><span class="dot"></span> live</span>
</header>
<main id="feed"><div class="empty">Loading…</div></main>
<div id="lb"><img id="lbimg" alt="screenshot"></div>
<script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
